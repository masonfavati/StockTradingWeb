services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stocktradingweb
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: stocktradingweb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocktradingweb -d stocktradingweb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
